services:
  db:
    image: postgres:16-alpine
    container_name: monthlyaudit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit_net

  backend:
    build: ./backend
    container_name: monthlyaudit-api
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app/static:/app/app/static
    networks:
      - audit_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: monthlyaudit-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - audit_net

  caddy:
    image: caddy:2.8-alpine
    container_name: monthlyaudit-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - audit_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  audit_net:
    driver: bridge